<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 900px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: #0F1B26;
    position: relative;
    color: #fff;
  }
  .frame { position: absolute; inset: 0; padding: 60px 72px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 25px; letter-spacing: .08em; color: #9FB2C2; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #2BD576; box-shadow: 0 0 0 6px rgba(43,213,118,.16); }
  .chip247 {
    font-weight: 800; font-size: 26px; background: #FFB81E; color: #16232E;
    padding: 9px 22px; border-radius: 999px; letter-spacing: .04em;
  }

  h1 {
    margin-top: 64px;
    font-family: "Segoe UI Black", "Segoe UI", Arial, sans-serif;
    font-weight: 900;
    font-size: 96px;
    line-height: 1.04;
    letter-spacing: -0.012em;
  }
  h1 .amber { color: #FFB81E; }
  .sub {
    margin-top: 26px; font-size: 33px; font-weight: 600; color: #C3D0DC;
  }
  .sub b { color: #2BD576; font-weight: 800; }

  /* conversation strip */
  .strip { position: absolute; left: 72px; right: 72px; bottom: 64px; }
  .row { display: flex; margin-bottom: 20px; }
  .row.right { justify-content: flex-end; }
  .msg {
    max-width: 62%; padding: 22px 28px; border-radius: 26px;
    font-size: 30px; line-height: 1.3; font-weight: 600;
  }
  .client { background: #1E2E3C; color: #DCE6EF; border-bottom-left-radius: 8px; }
  .bot {
    background: #FFB81E; color: #16232E; border-bottom-right-radius: 8px;
    box-shadow: 0 16px 40px rgba(255,184,30,.25);
  }
  .tag {
    position: absolute; right: 0; bottom: -6px;
    transform: translateY(100%);
  }
  .typing { display: flex; align-items: center; gap: 12px; color: #9FB2C2; font-size: 22px; font-weight: 600; margin-top: 4px; }
  .dots span {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #9FB2C2; margin-right: 4px; opacity: .85;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span>AI-АССИСТЕНТ · ЧАТ-БОТЫ · АВТОМАТИЗАЦИЯ</div>
      <div class="chip247">24/7</div>
    </div>

    <h1>Клиент спросил —<br>AI уже <span class="amber">ответил</span></h1>
    <div class="sub">По вашим ценам и условиям · <b>Демо бесплатно</b></div>

    <div class="strip">
      <div class="row"><div class="msg client">Добрый вечер! А вы завтра работаете? Хочу записаться</div></div>
      <div class="row right"><div class="msg bot">Да, с 10:00 до 19:00. Есть окно в 12:30 — записать вас? 📅</div></div>
      <div class="typing"><span class="dots"><span></span><span></span><span></span></span>ответ за 3 секунды, даже ночью</div>
    </div>
  </div>
</body>
</html>
