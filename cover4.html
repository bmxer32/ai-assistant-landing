<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 900px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: linear-gradient(160deg, #FFCE45 0%, #FFB81E 100%);
    position: relative;
    color: #16232E;
  }
  .glow {
    position: absolute; right: -220px; bottom: -260px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.30), rgba(255,255,255,0) 70%);
  }
  .frame { position: absolute; inset: 0; padding: 64px 72px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; letter-spacing: .06em; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #17A34A; box-shadow: 0 0 0 6px rgba(23,163,74,.22); }
  .night {
    display: flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 28px; background: #16232E; color: #FFCE45;
    padding: 10px 24px; border-radius: 999px; letter-spacing: .04em;
  }

  h1 {
    margin-top: 108px;
    font-family: "Segoe UI Black", "Segoe UI", Arial, sans-serif;
    font-weight: 900;
    font-size: 100px;
    line-height: 1.02;
    letter-spacing: -0.015em;
    max-width: 620px;
  }
  h1 .accent { color: #ffffff; text-shadow: 0 2px 0 rgba(22,35,46,.18); }

  .chips { display: flex; flex-direction: column; gap: 18px; margin-top: 46px; align-items: flex-start; }
  .chip {
    background: rgba(255,255,255,.85); border: 3px solid #16232E;
    font-weight: 700; font-size: 27px; padding: 12px 26px; border-radius: 999px;
  }
  .chip.free { background: #17A34A; color: #fff; border-color: #17A34A; }

  /* night notifications stack */
  .stack { position: absolute; right: 62px; top: 200px; width: 470px; }
  .note {
    display: flex; align-items: center; gap: 18px;
    background: #fff; border-radius: 24px; padding: 22px 24px;
    box-shadow: 0 22px 48px rgba(22,35,46,.24);
    margin-bottom: 22px;
  }
  .note .ico {
    width: 62px; height: 62px; border-radius: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .ico.blue { background: #E8F1FF; }
  .ico.green { background: #E6F6EC; }
  .ico.amber { background: #FFF3D6; }
  .note .txt { flex: 1; }
  .note .t1 { font-size: 24px; font-weight: 800; line-height: 1.2; }
  .note .t2 { font-size: 20px; color: #8795A1; font-weight: 600; margin-top: 4px; }
  .note .when { font-size: 20px; color: #8795A1; font-weight: 700; align-self: flex-start; }
  .n1 { transform: rotate(-2deg); }
  .n2 { transform: rotate(1.3deg); margin-left: 26px; }
  .n3 { transform: rotate(-1.2deg); }
  .sum {
    margin-top: 6px; margin-left: 12px;
    display: inline-flex; align-items: center; gap: 12px;
    background: #16232E; color: #fff; border-radius: 999px;
    padding: 14px 26px; font-size: 23px; font-weight: 700;
    box-shadow: 0 18px 40px rgba(22,35,46,.30);
    transform: rotate(-1deg);
  }
  .sum b { color: #FFCE45; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span>AI-АССИСТЕНТ ДЛЯ БИЗНЕСА</div>
      <div class="night">🌙 Ночная смена</div>
    </div>

    <h1>Продаёт, пока вы <span class="accent">спите</span></h1>

    <div class="chips">
      <div class="chip free">Ни одной потерянной заявки</div>
      <div class="chip">Заказы · Оплата · Запись</div>
    </div>
  </div>

  <div class="stack">
    <div class="note n1">
      <div class="ico blue">💬</div>
      <div class="txt">
        <div class="t1">Ответил на вопрос</div>
        <div class="t2">про доставку и оплату</div>
      </div>
      <div class="when">02:47</div>
    </div>
    <div class="note n2">
      <div class="ico green">✅</div>
      <div class="txt">
        <div class="t1">Принял заказ на&nbsp;4&nbsp;500&nbsp;₽</div>
        <div class="t2">оплачен онлайн</div>
      </div>
      <div class="when">03:12</div>
    </div>
    <div class="note n3">
      <div class="ico amber">📅</div>
      <div class="txt">
        <div class="t1">Записал клиента</div>
        <div class="t2">на завтра, 12:30</div>
      </div>
      <div class="when">05:58</div>
    </div>
    <div class="sum">Утром вам — только <b>отчёт</b></div>
  </div>
</body>
</html>
